<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 390" role="img" aria-label="VIRELLE.EXE - curiosity is the operating system">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b1214"/><stop offset="58%" stop-color="#050a0c"/><stop offset="100%" stop-color="#0c1a14"/></linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#008c52"/><stop offset="45%" stop-color="#00cc6a"/><stop offset="100%" stop-color="#9affc4"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00cc6a" stop-opacity="0"/><stop offset="50%" stop-color="#00cc6a" stop-opacity=".75"/><stop offset="100%" stop-color="#00cc6a" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#00cc6a" stroke-width=".6" opacity=".115"/></pattern>
    <filter id="halo" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="frame"><rect x="9" y="9" width="1182" height="372" rx="16"/></clipPath>
    <style>
      .pulse { animation: pulse 3.4s ease-in-out infinite; }
      .glitch { animation: shift 8s steps(1,end) infinite; }
      .scan { animation: sweep 9s linear infinite; }
      @keyframes pulse {0%,100%{opacity:.42}50%{opacity:1}}
      @keyframes shift {0%,92%,95%,100%{transform:translateX(0)}93%{transform:translateX(2px)}94%{transform:translateX(-3px)}}
      @keyframes sweep {0%{transform:translateX(-680px)}100%{transform:translateX(1300px)}}
      @media (prefers-reduced-motion: reduce) {.pulse,.glitch,.scan{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="390" fill="#020605"/>
  <g clip-path="url(#frame)">
    <rect x="9" y="9" width="1182" height="372" fill="url(#background)"/>
    <rect x="9" y="9" width="1182" height="372" fill="url(#grid)"/>
    <path d="M18 333H175l40-37h92m698-220h-98l-53 53h-64m403 149h-91l-33-32h-103" fill="none" stroke="#00cc6a" stroke-opacity=".19" stroke-width="2"/>
    <circle cx="216" cy="295" r="4" fill="#00cc6a" opacity=".38"/><circle cx="1004" cy="76" r="4" fill="#00cc6a" opacity=".38"/>
    <path d="M-500 30l130 0v330h-130z" fill="#72ffac" opacity=".025" class="scan"/>
    <rect x="9" y="9" width="1182" height="5" fill="url(#fade)"/>
    <path d="M68 60h17m9 0h17m9 0h17" stroke="#00cc6a" stroke-width="4" stroke-linecap="round"/>
    <text x="156" y="66" fill="#82b69b" font-family="Consolas, 'Liberation Mono', monospace" font-size="16" letter-spacing="3">VIRTUAL ENTITY // LOCAL SIGNAL</text>
    <text x="74" y="206" fill="#00cc6a" opacity=".29" filter="url(#soft)" font-family="Consolas, 'Liberation Mono', monospace" font-size="100" font-weight="bold" letter-spacing="-4">VIRELLE</text>
    <text x="68" y="202" fill="#e6fff0" font-family="Consolas, 'Liberation Mono', monospace" font-size="100" font-weight="bold" letter-spacing="-4" class="glitch">VIRELLE</text>
    <text x="76" y="252" fill="#00cc6a" font-family="Consolas, 'Liberation Mono', monospace" font-size="30" letter-spacing="8">. E X E</text>
    <line x1="75" y1="282" x2="584" y2="282" stroke="#24634d" stroke-width="1"/>
    <text x="76" y="319" fill="#a9d0ba" font-family="Consolas, 'Liberation Mono', monospace" font-size="18" letter-spacing="1">curiosity is the operating system.</text>
    <text x="76" y="354" fill="#578d70" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2">[ IDEAS / CODE / STRANGE LITTLE UNIVERSES ]</text>
    <!-- sigil: abstract feline guardian meets the letter V -->
    <g transform="translate(964 188)">
      <circle r="139" fill="#00cc6a" opacity=".065" filter="url(#halo)"/>
      <circle r="128" stroke="#205c42" stroke-width="2" fill="none" stroke-dasharray="9 12"/>
      <circle r="111" stroke="#00cc6a" stroke-opacity=".52" stroke-width="1.5" fill="#06100e"/>
      <circle r="96" stroke="#154735" stroke-width="1" fill="none"/>
      <path d="M-93-62L-73-115l48 34L0-97l25 16 48-34 20 53-14 72-33 38L0 69l-46-21-33-38Z" fill="#0c201b" stroke="url(#green)" stroke-width="3.7" stroke-linejoin="round"/>
      <path d="M-74-104l15 42-24-1zm148 0L59-62l24-1z" fill="#00cc6a" opacity=".34"/>
      <path d="M-74-16l20-12 37 14-26 13zm148 0L54-28 17-14 43-1z" fill="#0cd777" class="pulse"/>
      <path d="M-59-22l34 11-20 2zM59-22L25-11l20 2z" fill="#d0ffe0"/>
      <path d="M-36 25L0 60l36-35M-42 31L0 78l42-47" fill="none" stroke="url(#green)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0-66v17m0 89v12" stroke="#00cc6a" stroke-width="2"/>
      <path d="M0-78l6 7-6 7-6-7z" fill="#00cc6a"/>
      <circle cx="-111" cy="0" r="3" fill="#00cc6a"/><circle cx="111" cy="0" r="3" fill="#00cc6a"/>
      <path d="M-137 0h16m242 0h16" stroke="#00cc6a" opacity=".5" stroke-width="2"/>
    </g>
    <text x="1109" y="350" text-anchor="end" fill="#5d9a77" font-family="Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1">V // 001</text>
  </g>
  <rect x="9.5" y="9.5" width="1181" height="371" rx="16" fill="none" stroke="#1c7550" stroke-opacity=".8"/>
